# uQ Settings page for scdr. Installed to /usr/share/uq/settings/pages/scdr/ by scdr's
# package; inert without uQ. Reference: docs/settings-pages.md in the uQ repository.
uq_api = 3
id = "scdr"
name = "Scheduling"
icon = "preferences-system-performance"
category = "apps"
qml = "Page.qml"
keywords = ["scdr", "cpu", "priority", "scheduler", "focus", "games", "audio", "performance"]

[[setting]]
id = "status"
label = "Scheduling on or paused"
keywords = ["pause", "resume", "running"]

[[setting]]
id = "roles"
label = "Boost the app you use, audio and games"
keywords = ["focus", "foreground", "game", "audio", "background", "boost"]

[[setting]]
id = "role-profiles"
label = "Profile each role gives"
keywords = ["role", "profile", "power", "foreground", "audio", "game", "background"]

[[setting]]
id = "scheduler"
label = "CPU scheduler"
keywords = ["scheduler", "sched_ext", "scx", "bpfland", "lavd", "devbox", "eevdf", "gaming", "power"]

[[setting]]
id = "available-schedulers"
label = "Available schedulers"
keywords = ["try", "trial", "install", "update", "git", "scx-scheds", "devbox"]

[[setting]]
id = "kernel-tuning"
label = "Kernel scheduler tuning"
keywords = ["eevdf", "preempt", "preemption", "slice", "latency"]

[[setting]]
id = "pressure"
label = "Background apps when the CPU is busy"
keywords = ["pressure", "psi", "background", "threshold", "hold"]

[[setting]]
id = "system"
label = "System-wide switches"
keywords = ["iocost", "autogroup", "disk", "io", "weight", "rescan", "recheck"]

[[setting]]
id = "profiles"
label = "Profiles"
keywords = ["profile", "nice", "ionice", "io", "policy", "uclamp", "weight", "oom", "slice", "inherit"]

[[setting]]
id = "rules"
label = "Your app rules"
keywords = ["rule", "priority", "app", "nice", "condition", "exe", "cmdline", "cgroup", "uid"]

[[setting]]
id = "file-rules"
label = "Rules from scdr's files"
keywords = ["rule", "shipped", "etc", "ananicy"]

[[setting]]
id = "follow-focus"
label = "Follow the focused window"
keywords = ["agent", "session", "focus", "window"]

[[setting]]
id = "overview-pressure"
label = "CPU pressure"
keywords = ["busy", "load", "psi", "cpu"]

[[setting]]
id = "boosted"
label = "Boosted apps"
keywords = ["boost", "now", "priority", "focus"]

[[setting]]
id = "system-facts"
label = "What scdr sees"
keywords = ["version", "uptime", "governor", "power", "disks", "memory", "pressure"]

[[setting]]
id = "explain"
label = "Why a process has its priority"
keywords = ["explain", "why", "pid", "rule", "profile"]

[[setting]]
id = "running"
label = "Running apps and their rules"
keywords = ["list", "processes", "rule", "unmatched"]

[[setting]]
id = "tools-check"
label = "Check the configuration and reload"
keywords = ["check", "validate", "reload", "files", "warnings"]

[[setting]]
id = "bench"
label = "Latency benchmark"
keywords = ["benchmark", "latency", "wake", "measure"]

[[setting]]
id = "import"
label = "Bring rules from another tool"
keywords = ["import", "ananicy", "system76", "rules", "convert"]

[[setting]]
id = "split"
label = "Agent tools get their own group"
keywords = ["split", "claude", "tools", "memory", "slice", "weight"]

[[setting]]
id = "exceptions"
label = "Programs scdr never changes"
keywords = ["exceptions", "launchers", "ignore", "names"]

[[setting]]
id = "config-files"
label = "Where your settings are saved"
keywords = ["settings.toml", "file", "layer", "etc"]

[[setting]]
id = "reset"
label = "Reset my changes"
keywords = ["reset", "undo", "defaults", "drop", "restore"]

[requires]
bins = ["scdrctl"]

# Writes (Resume, SetRoleEnabled, SetSettings, TryScheduler, EndSchedulerTrial) may wait for the
# person's password, so they get the longest deadline. Removing a rule and deleting or undoing a
# profile ask first inside the page (ConfirmDialog.qml, with what it changes). Pause, the settings
# files and the installers are commands below, which uQ confirms with a preview.
# Explain and Reload are the daemon's own: why a process has its priority, and read the files again.
[dbus]
name = "org.scdr.Daemon1"
path = "/org/scdr/Daemon1"
interface = "org.scdr.Daemon1"
methods = ["Status", "Processes", "Settings", "Explain", "Reload", "Resume", "SetRoleEnabled", "SetSettings", "TryScheduler", "EndSchedulerTrial"]
properties = ["State"]
bus = "system"
timeout_ms = { Reload = 120000, Resume = 120000, SetRoleEnabled = 120000, SetSettings = 120000, TryScheduler = 120000, EndSchedulerTrial = 120000 }

# The State property, read with busctl so uQ can follow its PropertiesChanged signal.
[[command]]
id = "state"
argv = ["/usr/bin/busctl", "--system", "--json=short", "get-property", "org.scdr.Daemon1", "/org/scdr/Daemon1", "org.scdr.Daemon1", "State"]
output = "json"
timeout_ms = 5000
watch = { signals = [{ bus = "system", interface = "org.freedesktop.DBus.Properties", member = "PropertiesChanged", path = "/org/scdr/Daemon1", sender = "org.scdr.Daemon1" }] }

# Whether the focus agent starts with the session: its enable link in the user's units.
[[command]]
id = "agent-state"
argv = ["/usr/bin/systemctl", "--user", "is-enabled", "scdr-session.service"]
output = "text"
timeout_ms = 5000
watch = { files = ["~/.config/systemd/user/graphical-session.target.wants/scdr-session.service"] }

[[command]]
id = "agent-on"
argv = ["/usr/bin/systemctl", "--user", "enable", "--now", "scdr-session.service"]
output = "none"
timeout_ms = 20000

[[command]]
id = "agent-off"
argv = ["/usr/bin/systemctl", "--user", "disable", "--now", "scdr-session.service"]
output = "none"
timeout_ms = 20000
confirm = "Stop following the focused window? The app you're using no longer gets a boost."

[[command]]
id = "start"
argv = ["/usr/bin/systemctl", "enable", "--now", "scdrd.service"]
output = "none"
timeout_ms = 120000

# More schedulers through the system's own package tools (src/bin/scdrctl/install.rs): `which`
# prints pamac, packagekit or terminal; the others open that installer, which asks for the
# password itself, and end when it does. A terminal stays open until the person closes it, so
# these get the longest deadline.
[[command]]
id = "installer-which"
argv = ["/usr/bin/scdrctl", "schedulers", "which"]
output = "text"
timeout_ms = 5000

[[command]]
id = "installer-install"
argv = ["/usr/bin/scdrctl", "schedulers", "install"]
output = "none"
timeout_ms = 600000
confirm = "Install the extra CPU schedulers (scx-scheds and scx-tools)? Your package manager asks for your password."
preview = "preview-installer-install"

[[command]]
id = "installer-update"
argv = ["/usr/bin/scdrctl", "schedulers", "update"]
output = "none"
timeout_ms = 600000
confirm = "Update the whole system, the schedulers included? Arch doesn't update one package alone."
preview = "preview-installer-update"

[[command]]
id = "installer-git"
argv = ["/usr/bin/scdrctl", "schedulers", "git"]
output = "none"
timeout_ms = 600000
confirm = "Build the newest schedulers from the AUR (scx-scheds-git)? This can take several minutes."
preview = "preview-installer-git"

# What each installer would run: reads, so they don't ask.
[[command]]
id = "preview-installer-install"
argv = ["/usr/bin/scdrctl", "schedulers", "install", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "preview-installer-update"
argv = ["/usr/bin/scdrctl", "schedulers", "update", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "preview-installer-git"
argv = ["/usr/bin/scdrctl", "schedulers", "git", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000

# Pause: the preview says what would be put back, from the daemon's own numbers. uQ shows it, and
# the pause itself asks for the person's password through polkit.
[[command]]
id = "preview-pause"
argv = ["/usr/bin/scdrctl", "pause", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "pause"
argv = ["/usr/bin/scdrctl", "pause"]
output = "none"
timeout_ms = 120000
confirm = "Pause scdr? Every app's priority goes back to what it was until you resume."
preview = "preview-pause"

# The settings made here (`scdrctl config`), followed from the settings file. Reads work while
# scdr is off; a change goes through scdrd, so polkit asks for the password, and scdr checks every
# value before it saves and refuses what it wouldn't load. Only the Preferences keys are allowed.
[[command]]
id = "config"
argv = ["/usr/bin/scdrctl", "config", "show", "--json"]
output = "json"
timeout_ms = 30000
watch = { files = ["/var/lib/scdr/settings.toml", "/etc/scdr/scdr.toml"] }

[[command]]
id = "config-set"
argv = ["/usr/bin/scdrctl", "config", "set", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "key", pattern = '^(system\.(iocost|autogroup|rescan_secs|exec_recheck_ms)|split\.(apps|keep|memory_high|io_weight|cpu_weight)|exceptions\.(name|launchers))$' }, { name = "value", pattern = '^[^\x00-\x1f\x7f-][^\x00-\x1f\x7f]{0,399}$' }]

[[command]]
id = "config-unset"
argv = ["/usr/bin/scdrctl", "config", "unset", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "key", pattern = '^(system\.(iocost|autogroup|rescan_secs|exec_recheck_ms)|split\.(apps|keep|memory_high|io_weight|cpu_weight)|exceptions\.(name|launchers))$' }]

[[command]]
id = "preview-config-reset"
argv = ["/usr/bin/scdrctl", "config", "reset", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "config-reset"
argv = ["/usr/bin/scdrctl", "config", "reset", "--json"]
output = "json"
timeout_ms = 120000
confirm = "Drop every setting, rule and profile you made here? scdr's own files apply again."
preview = "preview-config-reset"

# Reads that need no daemon: whether the files load, and which running app gets which rule.
[[command]]
id = "check"
argv = ["/usr/bin/scdrctl", "check", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "list"
argv = ["/usr/bin/scdrctl", "list", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "list-all"
argv = ["/usr/bin/scdrctl", "list", "--all", "--json"]
output = "json"
timeout_ms = 30000

# The latency benchmark: whether it can run (it needs scdrd stopped), then the run, which prints a
# line per step. It runs every CPU flat out for about a minute.
[[command]]
id = "bench-check"
argv = ["/usr/bin/scdrctl", "bench", "--check", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "bench"
argv = ["/usr/bin/scdrctl", "bench", "--ndjson"]
output = "ndjson"
timeout_ms = 600000
confirm = "Run the benchmark? Every CPU runs flat out for about a minute, so the screen may stutter."

# What importing rules would write and leave out. Writing them goes to /etc, which only an
# administrator can do, so the page shows the command instead of running it.
[[command]]
id = "preview-import-ananicy"
argv = ["/usr/bin/scdrctl", "import", "ananicy", "--dry-run", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "path", pattern = '^/[^\x00-\x1f\x7f]{1,400}$' }]

[[command]]
id = "preview-import-system76"
argv = ["/usr/bin/scdrctl", "import", "system76", "--dry-run", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "path", pattern = '^/[^\x00-\x1f\x7f]{1,400}$' }]
