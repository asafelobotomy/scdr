# SCDR default configuration — installed to /usr/share/scdr/scdr.toml.
#
# Don't edit this file; it is replaced on upgrade. Override it instead:
#   /etc/scdr/scdr.toml        [system] keys, profiles of the same name, rules
#   /etc/scdr/rules.d/*.toml   drop-ins (same file name masks /usr/share/scdr/rules.d)
# Rules from /etc are tried first, and the first matching rule wins.
#
# Check your changes with `scdrctl check`, then `systemctl reload scdrd`.

[system]
# Autogroup puts each session in its own CPU group, which makes nice values
# only count within that group. Turn it off so profiles apply system-wide.
autogroup = false
# Full /proc rescan as a safety net for missed process events (seconds, 0 = off).
rescan_secs = 60
# Re-check a process this long after exec, once systemd has moved it into its
# final cgroup (milliseconds, 0 = off).
exec_recheck_ms = 1500
# Enable the kernel's iocost controller on disks that don't use bfq, so
# io_weight takes effect there. Off by default; restored on shutdown.
iocost = false

# Agent apps run their tools (Claude Code sessions with their shells, tests,
# compilers and VMs; MCP servers) inside the app's own scope, so every
# per-app control treated them as the app. For these apps (by the name of
# their app.slice unit, as `scdrctl ps` shows it), each process running a
# different binary from the app moves, with what it starts, into a scope of
# its own: app-<app>-tools-<pid>.scope. `keep` lists helpers that stay.
# Set `apps = []` in /etc/scdr/scdr.toml to turn it off.
#
# An app's tool scopes share app-<app>-tools.slice, which gets these limits
# for all of them together (undone when scdr stops):
#   memory_high  systemd MemoryHigh=: past it the kernel reclaims the tools'
#                memory first (to swap/zram) and slows their allocations,
#                instead of the app's window; bytes with K/M/G/T, or % of RAM
#   io_weight    systemd IOWeight= (needs bfq or [system] iocost)
#   cpu_weight   systemd CPUWeight= (left unset: tools are work you wait on)
# scx_devbox treats the slice as neither focused nor background, and scdr's
# background role leaves it alone.
[split]
apps = ["com.anthropic.Claude", "uq-com_anthropic_Claude"]
keep = ["chrome_crashpad*", "chrome-sandbox", "crashpad_handler"]
memory_high = "50%"
io_weight = 50

[exceptions]
# Never touched. scx_* are sched_ext schedulers and scx_loader: demoting
# them with system services would slow the userspace half of a scheduler.
name = [
    "systemd", "systemd-*", "dbus-daemon", "dbus-broker*", "rtkit-daemon",
    "scdrd", "gamemoded", "scx_*",
    # Userspace OOM killers must keep up when memory runs out, not be
    # demoted with other system services (systemd-oomd is covered above).
    "earlyoom", "nohang",
]
# Tools that set priorities on purpose. The tool, whatever it execs, and all
# its descendants are left alone. (gamemoderun isn't here: games GameMode
# registers get the "game" role instead.)
launchers = [
    "chrt", "nice", "ionice", "taskset", "schedtool",
]
# systemd-run is not a launcher here: desktops start every app with
# `systemd-run --user --scope` (uQ, uwsm, app2unit), which only places it in a
# unit. If it does change priorities (--nice=), scdr sees values it didn't set
# and leaves them alone.

# ---------------------------------------------------------------------------
# Roles: profiles for what a process is doing right now, reported by the
# per-user session agent (`systemctl --user enable --now scdr-session`).
# They only apply to processes no rule matches. Precedence: game, audio,
# foreground, background.
#   foreground  processes in the focused window's app (its app.slice unit)
#   audio       processes with a running PipeWire audio stream
#   game        processes registered with GameMode
#   background  processes in apps that aren't focused, only while CPU
#               pressure is above [pressure] high (until it drops below low)
# [roles.power.<power-profiles-daemon profile>] overrides them; "" = off.
# ---------------------------------------------------------------------------

[roles]
foreground = "foreground"
audio = "audio-client"
game = "game"
background = "background"

[roles.power.power-saver]
foreground = ""

# CPU pressure (PSI "some" avg10: % of time tasks waited for a CPU) that
# turns the background role on, and off again. hold_secs is the least time
# between switches, so short spikes don't flip every app's weights.
[pressure]
high = 20.0
low = 5.0
hold_secs = 30

# ---------------------------------------------------------------------------
# Scheduler policy. Both are off unless configured; both are restored when
# scdrd stops.
#
# sched_ext: run a BPF scheduler through scx_loader (install scx-scheds and
# scx-tools). Values: "eevdf" (none) or "scheduler[:mode]", mode one of auto,
# gaming, powersave, lowlatency, server. Picked in this order: gaming (while a
# GameMode game runs), the power-profiles-daemon profile, default. A scheduler
# you switch to by hand (scxctl) is left running until scdr's choice changes.
#
# [sched_ext]
# enable = true
# default = "eevdf"
# gaming = "lavd:gaming"
# [sched_ext.power]
# performance = "bpfland"
# power-saver = "lavd:powersave"
#
# eevdf: the kernel's own scheduler knobs, used while no sched_ext scheduler
# runs. preempt: none, voluntary, full, lazy. base_slice_us: 100..100000.
#
# [eevdf]
# preempt = "full"
# [eevdf.power.power-saver]
# preempt = "lazy"
# base_slice_us = 4000
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Profiles. Fields (all optional; unset fields are left as they are):
#   nice           -20..19
#   sched          "other" | "batch" | "idle" | "fifo:1-99" | "rr:1-99"
#   slice_us       EEVDF time slice, 100..100000 µs. Shorter means the task
#                  preempts others sooner on wakeup (the kernel default is
#                  ~3000 µs on 8 CPUs). Ignored while a sched_ext scheduler runs.
#   io             "idle" | "be:0-7" | "rt:0-7" (only has an effect under bfq)
#   oom_score_adj  -1000..1000
#   uclamp_min/max 0..1024 CPU frequency hints per task. Only applied while
#                  a CPU uses the schedutil governor.
#   cpu_weight     1..10000 systemd CPUWeight= for the process's whole unit
#   io_weight      1..10000 systemd IOWeight= (needs bfq or [system] iocost)
#                  Weights only compete between sibling units in the same
#                  slice, so only give them to profiles that describe a whole
#                  unit (a service or an app), not e.g. a compiler running in
#                  your terminal's scope. The first matching process in a unit
#                  sets its weights; they are restored when it goes away.
#   inherit        name of a profile to start from
# ---------------------------------------------------------------------------

[profile.audio]
nice = -11
slice_us = 500
io = "rt:0"
oom_score_adj = -900
cpu_weight = 400

[profile.compositor]
nice = -5
slice_us = 1000
io = "be:0"
oom_score_adj = -900
cpu_weight = 400

[profile.desktop]
nice = -3
io = "be:2"
oom_score_adj = -500
cpu_weight = 200

[profile.game]
nice = -5
slice_us = 1500
io = "be:0"

[profile.foreground]
nice = -2
slice_us = 2000
uclamp_min = 256
cpu_weight = 300

[profile.audio-client]
nice = -4
slice_us = 1000

[profile.background]
nice = 5
cpu_weight = 50

[profile.session-services]
nice = 5
io = "be:6"

[profile.system-services]
nice = 8
io = "be:7"

[profile.package-manager]
sched = "batch"
nice = 12
io = "idle"
cpu_weight = 25
io_weight = 25

[profile.build]
sched = "batch"
nice = 15
io = "be:7"
oom_score_adj = 500

[profile.indexer]
sched = "idle"
nice = 19
io = "idle"
oom_score_adj = 800
cpu_weight = 20
io_weight = 20

# ---------------------------------------------------------------------------
# Rules. Conditions: name, exe, cmdline, cgroup, parent, ancestor, uid, plus
# not_name, not_exe, not_cmdline, not_cgroup, not_parent, not_ancestor. A
# string or list of globs; `*` matches across `/`. `name` matches comm, the
# exe file name, or argv[0]'s file name; `ancestor` matches any process up
# the parent chain (e.g. "steam"). Run `scdrctl explain <pid>` to see which
# rule matched and why. `scdrctl import` converts ananicy-cpp and
# system76-scheduler rules into a rules.d file.
# ---------------------------------------------------------------------------

[[rule]]
profile = "audio"
exe = [
    "/usr/bin/pipewire", "/usr/bin/pipewire-pulse", "/usr/bin/wireplumber",
    "/usr/bin/jackd", "/usr/bin/pulseaudio",
]

# Names are easy to fake (`exec -a kwin_wayland sleep`, or a renamed copy),
# and these profiles lower nice and shield from the OOM killer, so they
# match the binary's real path, under /usr where only root can put one.
[[rule]]
profile = "compositor"
exe = [
    "/usr/*/kwin_wayland", "/usr/*/kwin_x11", "/usr/*/gnome-shell", "/usr/*/Xwayland",
    "/usr/*/Xorg", "/usr/*/Hyprland", "/usr/*/hyprland", "/usr/*/sway", "/usr/*/niri", "/usr/*/labwc",
    "/usr/*/wayfire", "/usr/*/cosmic-comp",
]

[[rule]]
profile = "desktop"
exe = [
    "/usr/*/plasmashell", "/usr/*/krunner", "/usr/*/kded6", "/usr/*/xdg-desktop-portal*",
    "/usr/*/gnome-session-binary", "/usr/*/cosmic-panel", "/usr/*/waybar",
    # uQ: its Quickshell shell and lock screen, and the uqd session daemon.
    "/usr/*/quickshell", "/usr/*/qs", "/usr/*/uqd", "/usr/*/hyprlock",
]

[[rule]]
profile = "game"
cmdline = ["*/steamapps/common/*"]

[[rule]]
profile = "package-manager"
name = ["pacman", "paru", "yay", "pamac*", "makepkg", "flatpak", "fwupd*"]

# Compilers and linkers only. Build drivers (make, cargo, ninja) are left out on
# purpose: children inherit priorities, so `cargo run` would start your app demoted.
[[rule]]
profile = "build"
name = [
    "cc1", "cc1plus", "cc1obj", "rustc", "clang", "clang++", "ld", "ld.lld",
    "ld.bfd", "ld.gold", "mold", "lld", "javac",
]

[[rule]]
profile = "indexer"
name = [
    "baloo_file", "baloo_file_extractor", "tracker-miner-fs*", "localsearch*",
    "updatedb", "plocate-build", "man-db", "mandb",
]

[[rule]]
profile = "session-services"
cgroup = "/user.slice/*/user@*.service/background.slice/*"

[[rule]]
profile = "system-services"
cgroup = "/system.slice/*"
