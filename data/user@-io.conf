# Installed by scdr as /usr/lib/systemd/system/user@.service.d/50-scdr-io.conf.
#
# systemd delegates only the cpu, memory and pids controllers to user
# managers, so IOWeight= on a user's units (apps, scdr's io_weight profiles,
# an agent app's tools slice) is accepted but has no effect. This adds io.
# Takes effect at the next `systemctl daemon-reload` (installing the package
# runs one) for running user managers too.
[Service]
Delegate=pids memory cpu io
