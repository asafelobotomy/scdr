<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.scdr.Daemon1"/>
    <allow send_destination="org.scdr.Daemon1"/>
  </policy>

  <!-- Anyone may read state and report their own session's context (scdrd
       checks that reported pids belong to the caller). Pause, Resume,
       SetRoleEnabled, Reload, SetSettings, TryScheduler and
       EndSchedulerTrial are reachable, but scdrd only acts for root
       or callers polkit authorizes for org.scdr.control. -->
  <policy context="default">
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Processes"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Pause"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Resume"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="SetRoleEnabled"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Reload"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="SetForeground"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="SetAudioClients"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="SetGames"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Explain"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Status"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="Settings"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="SetSettings"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="TryScheduler"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.scdr.Daemon1" send_member="EndSchedulerTrial"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.scdr.Daemon1"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>
</busconfig>
